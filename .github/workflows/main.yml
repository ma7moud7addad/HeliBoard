name: Build Release APK

on:
  # السطر ده هو اللي بيخلي البناء يدوي بس من خلال زرار Run workflow
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # خطوة بناء التطبيق
    - name: Build with Gradle (RELEASE ONLY)
      run: ./gradlew assembleRelease

    # خطوة توقيع التطبيق باستخدام الأسرار اللي هتضيفها في جيت هب
    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    # خطوة رفع التطبيق الممضي عشان تحمله
    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: HeliBoard-Release-APK-Signed
        path: ${{steps.sign_app.outputs.signedReleaseFile}}
